<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
(function(){
var WINS=['home','cv','misfit','bundi','contact','mines','folder'];
var zTop=20,state={};
WINS.forEach(function(w){state[w]={min:false,closed:true};});
state['home'].closed=false;
var LABELS={home:'<img src="images/home.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;@brendandevoy',cv:'<img src="images/word.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;CV.doc',misfit:'<img src="images/power.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;@misfitbeer',bundi:'<img src="images/paint.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;@bundipaints',contact:'<img src="images/contact.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;Contact',mines:'<img src="images/mine.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;Minesweeper',folder:'<img src="images/folder.png" style="width:18px;height:18px;image-rendering:pixelated;">&nbsp;Random Stuff'};
var isMax={home:false,cv:false,misfit:false,bundi:true,contact:false,mines:false,folder:false};
var savedPos={};

function centreWin(id){
  var desk=document.getElementById('desktop'),el=document.getElementById('win-'+id);
  el.style.left=Math.max(0,Math.round((desk.offsetWidth-el.offsetWidth)/2))+'px';
  el.style.top=Math.max(0,Math.round((desk.offsetHeight-el.offsetHeight)/2))+'px';
}
function focusWin(id){
  WINS.forEach(function(w){var t=document.getElementById('tb-'+w);if(t)t.classList.add('inactive');});
  var el=document.getElementById('win-'+id);if(el)el.style.zIndex=++zTop;
  var t=document.getElementById('tb-'+id);if(t)t.classList.remove('inactive');
  updateTaskbar();
  updateClippy();
}
window.openWin=function(id){
  state[id].closed=false;state[id].min=false;
  var el=document.getElementById('win-'+id);
  var desk=document.getElementById('desktop');
  var dw=desk.offsetWidth;
  var dh=desk.offsetHeight;
  el.classList.remove('hidden');
  if(isMax[id]){
    el.classList.add('maximised');
    el.style.height='';
  } else {
    el.classList.remove('maximised');
    if(id==='cv'){
      el.style.width=Math.round(dw*0.60)+'px';
      el.style.height=Math.round(dh*0.90)+'px';
      el.style.left=Math.round(dw*0.10)+'px';
      el.style.top=Math.round(dh*0.03)+'px';
    }
    if(id==='misfit'){
      el.style.width=Math.round(dw*0.625)+'px';
      el.style.height=Math.round(dh*0.90)+'px';
      el.style.left=Math.round(dw*0.32)+'px';
      el.style.top=Math.round(dh*0.05)+'px';
    }
    if(id==='bundi'){
      el.style.width=Math.round(dw*0.58)+'px';
      el.style.height=Math.round(dh*0.80)+'px';
      el.style.left=Math.round(dw*0.12)+'px';
      el.style.top=Math.round(dh*0.03)+'px';
    }
    if(id==='contact'){
      el.style.width=Math.round(dw*0.22)+'px';
      el.style.left=Math.round(dw*0.38)+'px';
      el.style.top=Math.round(dh*0.12)+'px';
    }
    if(id==='mines'){
      el.style.left=Math.round(dw*0.65)+'px';
      el.style.top=Math.round(dh*0.08)+'px';
    }
    if(id==='folder'){
      el.style.width=Math.round(dw*0.30)+'px';
      el.style.left=Math.round(dw*0.35)+'px';
      el.style.top=Math.round(dh*0.25)+'px';
    }
  }
  focusWin(id);
  if(id==='mines')initMines();
  updateClippy();
};
window.minimiseWin=function(id){state[id].min=true;document.getElementById('win-'+id).classList.add('hidden');updateTaskbar();updateClippy();};
window.closeWin=function(id){
  state[id].closed=true;state[id].min=false;
  document.getElementById('win-'+id).classList.add('hidden');
  updateTaskbar();if('mines')clearInterval(mTimerInterval);
  updateClippy();
};
window.toggleMax=function(id){
  var el=document.getElementById('win-'+id);
  var desk=document.getElementById('desktop');
  if(isMax[id]){
    el.classList.remove('maximised');
    if(savedPos[id]){
      el.style.left=savedPos[id].l;
      el.style.top=savedPos[id].t;
      el.style.width=savedPos[id].w;
    }
    // Set a sensible restored height so content scrolls
    el.style.height=Math.round(desk.offsetHeight*0.90)+'px';
    isMax[id]=false;
  } else {
    savedPos[id]={l:el.style.left,t:el.style.top,w:el.style.width,h:el.style.height};
    el.classList.add('maximised');
    el.style.height='';
    isMax[id]=true;
  }
  focusWin(id);
  updateClippy();
  if(id==='cv') positionClippy();
};
function updateTaskbar(){
  var tb=document.getElementById('taskbar'),clock=document.getElementById('tb-clock');
  tb.querySelectorAll('.taskbar-btn').forEach(function(b){b.remove();});
  WINS.forEach(function(w){
    if(!state[w].closed){
      var btn=document.createElement('div');
      btn.className='taskbar-btn'+(state[w].min?'':' active');
      btn.innerHTML=LABELS[w];
      btn.onclick=(function(id){return function(){if(state[id].min)window.openWin(id);else window.minimiseWin(id);};})(w);
      tb.insertBefore(btn,clock);
    }
  });
}
window.submitContact=function(){
  var name=document.getElementById('c-name').value.trim();
  var email=document.getElementById('c-email').value.trim();
  var msg=document.getElementById('c-msg').value.trim();
  if(!name||!email||!msg){alert('Please fill in all fields!');return;}

  // Show sending state
  var sendBtn=document.querySelector('#win-contact .contact-btn');
  sendBtn.textContent='Sending...';
  sendBtn.disabled=true;

  fetch('https://formspree.io/f/mojpwzan', {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({name:name,email:email,message:msg})
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.ok){
      document.getElementById('c-confirm').style.display='block';
      document.getElementById('c-name').value='';
      document.getElementById('c-email').value='';
      document.getElementById('c-msg').value='';
    } else {
      alert('Something went wrong. Please email hey@brendandevoy.com directly.');
    }
    sendBtn.textContent='✉️ Send';
    sendBtn.disabled=false;
  })
  .catch(function(){
    alert('Could not send. Please email hey@brendandevoy.com directly.');
    sendBtn.textContent='✉️ Send';
    sendBtn.disabled=false;
  });
};

/* DRAG */
var drag=null,ox=0,oy=0;
window.startDrag=function(e,id){
  if(isMax[id])return;
  focusWin(id);drag=document.getElementById('win-'+id);
  var r=drag.getBoundingClientRect(),dr=document.getElementById('desktop').getBoundingClientRect();
  ox=e.clientX-(r.left-dr.left);oy=e.clientY-(r.top-dr.top);e.preventDefault();
};
document.addEventListener('mousemove',function(e){
  if(!drag)return;
  var dr=document.getElementById('desktop').getBoundingClientRect();
  var x=Math.max(0,Math.min(dr.width-drag.offsetWidth,e.clientX-dr.left-ox));
  var y=Math.max(0,Math.min(dr.height-drag.offsetHeight,e.clientY-dr.top-oy));
  drag.style.left=x+'px';
  drag.style.top=y+'px';
  // Keep Clippy anchored to CV window while dragging
  if(drag.id==='win-cv') positionClippy();
});
document.addEventListener('mouseup',function(){drag=null;});
WINS.forEach(function(w){var el=document.getElementById('win-'+w);if(el)el.addEventListener('mousedown',function(){focusWin(w);});});
window.selIcon=function(id){
  document.querySelectorAll('.icon').forEach(function(i){i.classList.remove('sel');});
  var ic=document.getElementById('ico-'+id);if(ic)ic.classList.add('sel');
};
document.addEventListener('click',function(e){if(!e.target.closest('.icon'))document.querySelectorAll('.icon').forEach(function(i){i.classList.remove('sel');});});

function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';

/* MINESWEEPER */
var mCfg={beginner:{rows:9,cols:9,mines:10},intermediate:{rows:16,cols:16,mines:40},expert:{rows:16,cols:30,mines:99}};
var mDiff='beginner',mBoard=[],mRevealed=[],mFlagged=[],mMinesList=[],mGameOver=false,mFirstClick=true;
var mTimer=0,mTimerInterval=null,mRows,mCols,mMineCount;
function pad3(n){return('000'+Math.max(0,n)).slice(-3);}
window.setDiff=function(d){
  mDiff=d;document.querySelectorAll('.diff-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('diff-'+d.substring(0,3)).classList.add('active');initMines();
};
window.initMines=function(){
  clearInterval(mTimerInterval);mTimer=0;mGameOver=false;mFirstClick=true;
  var cfg=mCfg[mDiff];mRows=cfg.rows;mCols=cfg.cols;mMineCount=cfg.mines;
  mBoard=[];mRevealed=[];mFlagged=[];mMinesList=[];
  for(var i=0;i<mRows*mCols;i++){mBoard.push(0);mRevealed.push(false);mFlagged.push(false);}
  document.getElementById('face-btn').textContent='\uD83D\uDE42';
  document.getElementById('mine-count').textContent=pad3(mMineCount);
  document.getElementById('mine-timer').textContent='000';
  document.getElementById('mines-status').textContent='Left-click to reveal. Right-click to flag.';
  renderMines();
};
function getN(r,c){var n=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;var nr=r+dr,nc=c+dc;if(nr>=0&&nr<mRows&&nc>=0&&nc<mCols)n.push(nr*mCols+nc);}return n;}
function placeMines(safe){
  var p=0;while(p<mMineCount){var idx=Math.floor(Math.random()*mRows*mCols);if(idx!==safe&&mBoard[idx]!==-1){mBoard[idx]=-1;mMinesList.push(idx);p++;}}
  for(var r=0;r<mRows;r++)for(var c=0;c<mCols;c++){var i2=r*mCols+c;if(mBoard[i2]===-1)continue;var cnt=0;getN(r,c).forEach(function(n){if(mBoard[n]===-1)cnt++;});mBoard[i2]=cnt;}
}
function revealCell(r,c){var idx=r*mCols+c;if(mRevealed[idx]||mFlagged[idx])return;mRevealed[idx]=true;if(mBoard[idx]===0)getN(r,c).forEach(function(n){revealCell(Math.floor(n/mCols),n%mCols);});}
var NC=['','#0000ff','#008000','#ff0000','#000080','#800000','#008080','#000000','#808080'];
function renderMines(){
  var grid=document.getElementById('mines-grid');
  grid.style.gridTemplateColumns='repeat('+mCols+', 22px)';grid.innerHTML='';
  for(var r=0;r<mRows;r++)for(var c=0;c<mCols;c++){
    var idx=r*mCols+c,cell=document.createElement('div');cell.className='mine-cell';
    if(mRevealed[idx]){cell.classList.add('revealed');if(mBoard[idx]===-1){cell.classList.add('boom');cell.textContent='\uD83D\uDCA3';}else if(mBoard[idx]>0){cell.textContent=mBoard[idx];cell.style.color=NC[mBoard[idx]];}}
    else if(mFlagged[idx])cell.textContent='\uD83D\uDEA9';
    (function(rr,cc,ii){cell.addEventListener('click',function(){hClick(rr,cc,ii);});cell.addEventListener('contextmenu',function(e){e.preventDefault();hFlag(rr,cc,ii);});})(r,c,idx);
    grid.appendChild(cell);
  }
  if(!isMax['mines']){var we=document.getElementById('win-mines');we.style.width=(mCols*22+36)+'px';}
}
function hClick(r,c,idx){
  if(mGameOver||mRevealed[idx]||mFlagged[idx])return;
  if(mFirstClick){mFirstClick=false;placeMines(idx);mTimerInterval=setInterval(function(){mTimer=Math.min(999,mTimer+1);document.getElementById('mine-timer').textContent=pad3(mTimer);},1000);}
  if(mBoard[idx]===-1){mGameOver=true;clearInterval(mTimerInterval);mRevealed[idx]=true;document.getElementById('face-btn').textContent='\uD83D\uDE35';document.getElementById('mines-status').textContent='BOOM! Click the face to try again.';mMinesList.forEach(function(mi){mRevealed[mi]=true;});}
  else{revealCell(r,c);checkWin();}
  renderMines();
}
function hFlag(r,c,idx){if(mGameOver||mRevealed[idx])return;mFlagged[idx]=!mFlagged[idx];document.getElementById('mine-count').textContent=pad3(mMineCount-mFlagged.filter(Boolean).length);renderMines();}
function checkWin(){if(mRevealed.filter(function(v){return!v;}).length===mMineCount){mGameOver=true;clearInterval(mTimerInterval);document.getElementById('face-btn').textContent='\uD83D\uDE0E';document.getElementById('mines-status').textContent='\uD83C\uDF89 You win! Time: '+mTimer+'s';}}

/* SCREENSAVER — 1 minute */
var ssActive=false,ssTimer=null,ssRaf=null;
var SS_DELAY=60000;
function resetSSTimer(){clearTimeout(ssTimer);ssTimer=setTimeout(startSS,SS_DELAY);}
function startSS(){
  ssActive=true;
  var ss=document.getElementById('screensaver');ss.style.display='block';
  var cv=document.getElementById('ss-canvas');cv.width=window.innerWidth;cv.height=window.innerHeight;
  var ctx=cv.getContext('2d');
  var stars=[];for(var i=0;i<200;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,z:Math.random()*cv.width,pz:0});
  var txt={x:cv.width/2,y:cv.height/2,dx:2.5,dy:1.8,hue:0};
  function drawSS(){
    if(!ssActive)return;
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';
    stars.forEach(function(s){
      s.pz=s.z;s.z-=4;
      if(s.z<=0){s.x=Math.random()*cv.width;s.y=Math.random()*cv.height;s.z=cv.width;s.pz=s.z;}
      var sx=(s.x-cv.width/2)*(cv.width/s.z)+cv.width/2;
      var sy=(s.y-cv.height/2)*(cv.width/s.z)+cv.height/2;
      var r=Math.max(0.5,(1-s.z/cv.width)*3);
      if(sx>0&&sx<cv.width&&sy>0&&sy<cv.height){ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();}
    });
    txt.hue=(txt.hue+1)%360;
    ctx.font='bold 48px Arial Black,Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='hsl('+txt.hue+',100%,60%)';
    ctx.fillText('BRENDAN DEVOY',txt.x,txt.y);
    txt.x+=txt.dx;txt.y+=txt.dy;
    var tw=ctx.measureText('BRENDAN DEVOY').width/2;
    if(txt.x+tw>cv.width||txt.x-tw<0){txt.dx*=-1;txt.hue=(txt.hue+60)%360;}
    if(txt.y+30>cv.height||txt.y-30<0){txt.dy*=-1;txt.hue=(txt.hue+60)%360;}
    ssRaf=requestAnimationFrame(drawSS);
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  drawSS();
}
window.dismissSS=function(){
  if(!ssActive)return;ssActive=false;cancelAnimationFrame(ssRaf);
  document.getElementById('screensaver').style.display='none';resetSSTimer();
};
document.getElementById('screensaver').addEventListener('click',window.dismissSS);
document.getElementById('screensaver').addEventListener('mousemove',window.dismissSS);
document.addEventListener('mousemove',function(){if(!ssActive)resetSSTimer();});
document.addEventListener('keydown',function(){if(ssActive)window.dismissSS();else resetSSTimer();});

/* CLIPPY */
var clippyMsgs=[
  "Wow, that looks like a great CV!",
  "Don't forget too spell-check!",
  "Your document has been saved. Probably.",
  "I detected 0 errors. That seems suspicious."
];
var clippyIdx=0,clippyClosed=false,clippyEverMaximised=false;
window.clippyClick=function(){
  clippyClosed=false;
  clippyIdx=(clippyIdx+1)%clippyMsgs.length;
  document.getElementById('clippy-text').textContent=clippyMsgs[clippyIdx];
  document.getElementById('clippy-bubble').style.display='block';
};
window.clippyClose=function(){
  clippyClosed=true;
  document.getElementById('clippy-bubble').style.display='none';
};
function updateClippy(){
  var cvOpen=(state['cv'].closed===false)&&(state['cv'].min===false);
  if(cvOpen) clippyEverMaximised=true;
  var wrap=document.getElementById('clippy-wrap');
  var bubble=document.getElementById('clippy-bubble');
  var cvEl=document.getElementById('win-cv');
  if(clippyEverMaximised&&cvOpen){
    // Only show Clippy if CV is the focused window
    var cvZ=parseInt(cvEl.style.zIndex||0);
    var isCvFocused=true;
    document.querySelectorAll('.win').forEach(function(w){
      if(w.id!=='win-cv'&&!w.classList.contains('hidden')){
        var wZ=parseInt(w.style.zIndex||0);
        if(wZ>cvZ) isCvFocused=false;
      }
    });
    if(isCvFocused){
      wrap.style.display='flex';
      // Set Clippy z-index just above CV window
      wrap.style.zIndex=cvZ+1;
      if(!clippyClosed){
        document.getElementById('clippy-text').textContent=clippyMsgs[clippyIdx];
        bubble.style.display='block';
      }
      positionClippy();
    } else {
      wrap.style.display='none';
      bubble.style.display='none';
    }
  } else {
    wrap.style.display='none';
    bubble.style.display='none';
  }
}

function positionClippy(){
  var cvEl=document.getElementById('win-cv');
  var wrap=document.getElementById('clippy-wrap');
  var svg=document.getElementById('clippy-svg');
  if(!cvEl||!wrap||!svg)return;
  if(isMax['cv']){
    wrap.style.bottom='75px';
    wrap.style.right='40px';
    wrap.style.top='auto';
    wrap.style.left='auto';
  } else {
    var r=cvEl.getBoundingClientRect();
    var svgHeight=svg.offsetHeight||80;
    var svgWidth=svg.offsetWidth||80;
    // Anchor based on SVG size only, ignoring bubble
    wrap.style.left=(r.right - svgWidth - 40)+'px';
    wrap.style.top=(r.bottom - svgHeight - 50)+'px';
    wrap.style.bottom='auto';
    wrap.style.right='auto';
  }
}

/* START MENU */
var startOpen=false;
window.toggleStartMenu=function(){
  startOpen=!startOpen;
  document.getElementById('start-menu').classList.toggle('open',startOpen);
};
window.closeStartMenu=function(){
  startOpen=false;document.getElementById('start-menu').classList.remove('open');
};
window.startOpen=function(id){
  window.closeStartMenu();
  window.openWin(id);
};
document.addEventListener('click',function(e){
  if(startOpen&&!e.target.closest('#start-menu')&&!e.target.closest('.start-btn')){
    window.closeStartMenu();
  }
});

/* LIGHTBOX */
var lbSrcs=[], lbIdx=0;

function lbCollect(){
  var imgs=[];
  // Collect from desktop paint window
  document.querySelectorAll('#paint-canvas .paint-img').forEach(function(img){
    if(img.src) imgs.push(img.src);
  });
  // Collect from mobile paint window
  document.querySelectorAll('#m-win-bundi .m-img-4 img').forEach(function(img){
    if(img.src) imgs.push(img.src);
  });
  // Deduplicate
  var seen={}, unique=[];
  imgs.forEach(function(s){ if(!seen[s]){seen[s]=true;unique.push(s);} });
  return unique;
}

window.lbOpen=function(src){
  lbSrcs=lbCollect();
  lbIdx=lbSrcs.indexOf(src);
  if(lbIdx<0) lbIdx=0;
  lbShow();
};
function lbShow(){
  document.getElementById('lb-img').src=lbSrcs[lbIdx];
  document.getElementById('lb-counter').textContent=(lbIdx+1)+' / '+lbSrcs.length;
  document.getElementById('lightbox').classList.add('lb-open');
}
window.lbClose=function(){
  document.getElementById('lightbox').classList.remove('lb-open');
};
window.lbPrev=function(e){
  e.stopPropagation();
  lbIdx=(lbIdx-1+lbSrcs.length)%lbSrcs.length;
  lbShow();
};
window.lbNext=function(e){
  e.stopPropagation();
  lbIdx=(lbIdx+1)%lbSrcs.length;
  lbShow();
};
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('lb-open')) return;
  if(e.key==='Escape') window.lbClose();
  if(e.key==='ArrowLeft') window.lbPrev(e);
  if(e.key==='ArrowRight') window.lbNext(e);
});

// Wire up all paint images (desktop + mobile) after DOM is ready
setTimeout(function(){
  document.querySelectorAll('#paint-canvas .paint-img, #m-win-bundi .m-img-4 img').forEach(function(img){
    img.addEventListener('click',function(e){
      e.stopPropagation();
      window.lbOpen(img.src);
    });
  });
},300);
